# Requires an existing Docker network named "local-network" that can assign
# addresses on 192.168.1.0/24 (typically macvlan/ipvlan on the LAN NIC).
# Example:
#   docker network create -d macvlan \
#     --subnet=192.168.1.0/24 \
#     --gateway=192.168.1.254 \
#     -o parent=YOUR_LAN_INTERFACE \
#     local-network

x-bitaxe: &bitaxe
  build: .
  restart: unless-stopped
  dns:
    - 192.168.1.254

services:
  bitaxe-gamma-41:
    <<: *bitaxe
    container_name: bitaxe-gamma-41
    environment:
      DEVICE_IP: "192.168.1.41"
      HOSTNAME: bitaxe-gamma-41
      MAC_ADDR: "02:BA:41:00:00:01"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.41

  bitaxe-gamma-42:
    <<: *bitaxe
    container_name: bitaxe-gamma-42
    environment:
      DEVICE_IP: "192.168.1.42"
      HOSTNAME: bitaxe-gamma-42
      MAC_ADDR: "02:BA:41:00:00:02"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.42

  bitaxe-gamma-43:
    <<: *bitaxe
    container_name: bitaxe-gamma-43
    environment:
      DEVICE_IP: "192.168.1.43"
      HOSTNAME: bitaxe-gamma-43
      MAC_ADDR: "02:BA:41:00:00:03"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.43

  bitaxe-gamma-44:
    <<: *bitaxe
    container_name: bitaxe-gamma-44
    environment:
      DEVICE_IP: "192.168.1.44"
      HOSTNAME: bitaxe-gamma-44
      MAC_ADDR: "02:BA:41:00:00:04"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.44

  bitaxe-gamma-45:
    <<: *bitaxe
    container_name: bitaxe-gamma-45
    environment:
      DEVICE_IP: "192.168.1.45"
      HOSTNAME: bitaxe-gamma-45
      MAC_ADDR: "02:BA:41:00:00:05"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.45

  bitaxe-gamma-46:
    <<: *bitaxe
    container_name: bitaxe-gamma-46
    environment:
      DEVICE_IP: "192.168.1.46"
      HOSTNAME: bitaxe-gamma-46
      MAC_ADDR: "02:BA:41:00:00:06"
      BOARD_VERSION: "601"
    networks:
      local-network:
        ipv4_address: 192.168.1.46

networks:
  local-network:
    external: true
    name: local-network
